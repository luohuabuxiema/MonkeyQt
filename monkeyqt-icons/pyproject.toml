[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeyqt-icons"
version = "2.1.2"
description = "High-performance, chainable Phosphor Icons library for PySide6, PyQt6, and PyQt5."
readme = "README.md"
authors = [{ name = "MonkeyQt Team" }]
license = { text = "MIT" }
keywords = ["pyside6", "pyqt5", "pyqt6", "qt", "icons", "phosphor-icons", "vector", "svg", "ui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/luohuabuxiema/MonkeyQt"

[tool.setuptools.packages.find]
where = ["."]
include = ["monkeyqt_icons*"]

[tool.setuptools.package-data]
monkeyqt_icons = ["assets/**/*.svg", "*.pyi"]
